name: tests

on:
  push:
  pull_request:
  schedule:
    - cron: '0 1 * * 1'  # Mondays 01:00 UTC: catches upstream API and dependency changes
  workflow_dispatch:

jobs:
  pytest:
    # GitHub-hosted runners are in the US, where api.binance.com answers HTTP 451:
    # passing here proves the package does not depend on it.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[test]"
      - run: pytest
        env:
          MPLBACKEND: Agg
